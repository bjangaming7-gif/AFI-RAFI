<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFI RAFI</title><style>*{box-sizing:border-box}body{margin:0;background:#080a13;color:#fff;font-family:Arial}header{padding:18px 6%;background:#111728;display:flex;justify-content:space-between;align-items:center}.logo,h1{color:#54e7ff}.logo{font-size:24px;font-weight:bold}main{max-width:900px;margin:auto;padding:20px}.hero{text-align:center;padding:45px 20px;background:linear-gradient(135deg,#151b32,#080a13);border-radius:18px}section{background:#111728;padding:20px;margin:20px 0;border-radius:15px}button{background:linear-gradient(90deg,#54e7ff,#9a72ff);padding:12px 18px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}input,select{display:block;width:100%;padding:12px;margin:10px 0;background:#080a13;color:white;border:1px solid #344563;border-radius:8px}.card{background:#080a13;padding:15px;margin:10px 0;border-radius:10px}video{max-width:100%;margin-top:12px}footer{text-align:center;color:#9aa6c5;padding:25px}</style></head><body><header><div class="logo">AFI RAFI</div><a href="#join"><button>JOIN NOW</button></a></header><main><div class="hero"><h1>YOUR WORLD. YOUR PLAY.</h1><p>Gaming • Anime • Creator Community</p></div><section id="join"><h2>Create Your Profile</h2><form id="signup"><input id="name" placeholder="Your Name / Nickname" required><input id="email" type="email" placeholder="Email (optional)"><input id="age" type="number" min="13" placeholder="Age" required><input id="school" placeholder="School (optional)"><select id="privacy"><option>Public</option><option>Private</option></select><button type="submit">Create Profile</button></form><div id="profile"></div></section><section><h2>Creator Studio</h2><input id="title" placeholder="Video title"><input id="file" type="file" accept="video/*"><button onclick="previewVideo()">Preview Video</button><div id="video"></div></section><section><h2>Explore</h2><div class="card">🎮 Gaming Highlights</div><div class="card">🌌 Anime Videos</div><div class="card">⚡ Creator Zone</div></section><section><h2>Find Creators</h2><input id="search" placeholder="Search creator name or ID"><button onclick="searchCreator()">Search</button><p id="searchResult"></p></section><section><h2>Messages</h2><p>Messaging demo — real chat needs a secure backend.</p><input placeholder="Write a message (demo)"><button onclick="alert('Demo only')">Send</button></section></main><footer>AFI RAFI • Gaming & Anime Community</footer><script>document.getElementById('signup').addEventListener('submit',function(e){e.preventDefault();const p={name:document.getElementById('name').value,email:document.getElementById('email').value,age:document.getElementById('age').value,school:document.getElementById('school').value,privacy:document.getElementById('privacy').value};localStorage.setItem('afirafi_profile',JSON.stringify(p));document.getElementById('profile').innerHTML='<div class="card"><h3>Welcome, '+p.name.replace(/[<>]/g,'')+'!</h3><p>Profile saved on this device.</p></div>';});function previewVideo(){const f=document.getElementById('file').files[0];if(!f){alert('Choose a video first');return;}document.getElementById('video').innerHTML='';const v=document.createElement('video');v.controls=true;v.src=URL.createObjectURL(f);document.getElementById('video').appendChild(v);}function searchCreator(){document.getElementById('searchResult').textContent='Search demo: online creator search needs a database.';}</script></body></html>
